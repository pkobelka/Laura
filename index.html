<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kvízy se strejdou Peťou</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        .container {
            background-color: white;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 500px;
            width: 100%;
            border: 4px solid #1f5f8b;
            max-height: 95vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        h1 {
            color: #1f5f8b;
            margin-top: 0;
            margin-bottom: 4px;
            font-size: 26px;
        }

        .subtitle {
            color: #555;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .emoji {
            font-size: 54px;
            margin: 6px 0 12px;
        }

        .quiz-list {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
        }

        .quiz-list a {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #1f5f8b;
            background-color: #eaf4fb;
            border: 2px solid #a1c4fd;
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 12px;
            font-size: 18px;
            font-weight: 600;
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        .quiz-list a:hover {
            background-color: #d6ebfa;
            transform: translateY(-2px);
        }

        .quiz-list .icon {
            font-size: 28px;
        }

        .quiz-list .who {
            display: block;
            font-size: 13px;
            font-weight: 400;
            color: #666;
        }

        .footer {
            margin-top: 18px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🎈</div>
        <h1>Kvízy se strejdou Peťou</h1>
        <p class="subtitle">Vyber si kvíz a pusť se do toho!</p>

        <!-- Nový kvíz přidáš tak, že sem zkopíruješ jeden <li> a upravíš odkaz, ikonu a jméno. -->
        <ul class="quiz-list">
            <li>
                <a href="kvizy/laura-stitch-matematika.html">
                    <span class="icon">➕</span>
                    <span>Stitchova matematika
                        <span class="who">pro Laurinku</span>
                    </span>
                </a>
            </li>
            <li>
                <a href="kvizy/eva-jirka-hospodsky-kviz-01.html">
                    <span class="icon">🍺</span>
                    <span>Hospodský kvíz – díl 1
                        <span class="who">Hánům na dovolenou od Petra a Alky</span>
                    </span>
                </a>
            </li>
            <li>
                <a href="kvizy/eva-jirka-hospodsky-kviz-02.html">
                    <span class="icon">🍺</span>
                    <span>Hospodský kvíz – díl 2
                        <span class="who">Hánům na dovolenou od Petra a Alky</span>
                    </span>
                </a>
            </li>
        </ul>

        <p class="footer">Vyrobeno s láskou 💙</p>
    </div>
</body>
</html>
