<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospodský kvíz – Evě a přátelům na zahradu</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #7a4a22 0%, #3a2417 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        .container {
            background-color: #fff7e9;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.35);
            text-align: center;
            max-width: 500px;
            width: 100%;
            border: 5px solid #c8811a;
            max-height: 95vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        h1 {
            color: #3a2417;
            margin-top: 0;
            margin-bottom: 4px;
            font-size: 26px;
        }

        .subtitle {
            color: #7a5a3a;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .emoji {
            font-size: 54px;
            margin: 6px 0 12px;
        }

        .quiz-list {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
        }

        .quiz-list a {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #3a2417;
            background-color: #fdeccb;
            border: 2px solid #c8811a;
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 12px;
            font-size: 18px;
            font-weight: 600;
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        .quiz-list a:hover {
            background-color: #f7dca8;
            transform: translateY(-2px);
        }

        .quiz-list .icon { font-size: 28px; }

        .quiz-list .who {
            display: block;
            font-size: 13px;
            font-weight: 400;
            color: #8a6a4a;
        }

        .footer {
            margin-top: 18px;
            font-size: 13px;
            color: #a08a6a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🍻🌻</div>
        <h1>Hospodský kvíz</h1>
        <p class="subtitle">Evě a přátelům na zahradu · vyberte si díl a pusťte se do toho!</p>

        <ul class="quiz-list">
            <li>
                <a href="kvizy/eva-hospodsky-kviz-01.html">
                    <span class="icon">🍺</span>
                    <span>1. díl
                        <span class="who">5 okruhů, 50 otázek</span>
                    </span>
                </a>
            </li>
            <li>
                <a href="kvizy/eva-hospodsky-kviz-02.html">
                    <span class="icon">🍺</span>
                    <span>2. díl
                        <span class="who">nové otázky</span>
                    </span>
                </a>
            </li>
            <li>
                <a href="kvizy/eva-hospodsky-kviz-03.html">
                    <span class="icon">🍺</span>
                    <span>3. díl
                        <span class="who">a další nové otázky</span>
                    </span>
                </a>
            </li>
            <li>
                <a href="kvizy/eva-hospodsky-kviz-04.html">
                    <span class="icon">🍺</span>
                    <span>4. díl
                        <span class="who">další nové otázky</span>
                    </span>
                </a>
            </li>
            <li>
                <a href="kvizy/eva-hospodsky-kviz-05.html">
                    <span class="icon">🍺</span>
                    <span>5. díl
                        <span class="who">a ještě další</span>
                    </span>
                </a>
            </li>
        </ul>

        <p class="footer">Na zdraví! 🥃</p>
    </div>
</body>
</html>
