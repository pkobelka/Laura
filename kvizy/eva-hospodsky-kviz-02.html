<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospodský kvíz – Evě a přátelům (2. díl)</title>
    <style>
        :root {
            --tmava: #3a2417;
            --amber: #c8811a;
            --amber-svetla: #f0b850;
            --krem: #fff7e9;
            --zelena: #3f8f3f;
            --cervena: #c0392b;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #7a4a22 0%, #3a2417 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 12px;
        }
        .kviz {
            background-color: var(--krem);
            width: 100%;
            max-width: 560px;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.35);
            border: 5px solid var(--amber);
            max-height: 96vh;
            overflow-y: auto;
            padding: 20px;
        }

        .horni-lista {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .skore-box {
            font-weight: bold;
            font-size: 17px;
            color: var(--tmava);
            background: #fdeccb;
            border: 2px dashed var(--amber);
            border-radius: 10px;
            padding: 6px 12px;
        }
        .skore-box span { color: var(--zelena); }
        .mute-btn {
            font-size: 22px;
            background: #fdeccb;
            border: 2px solid var(--amber);
            border-radius: 10px;
            width: 46px;
            height: 42px;
            cursor: pointer;
            line-height: 1;
        }

        h1 {
            color: var(--tmava);
            text-align: center;
            font-size: 27px;
            margin: 6px 0 4px;
        }
        .podtitulek {
            text-align: center;
            color: #7a5a3a;
            font-size: 17px;
            margin-bottom: 14px;
        }
        .velky-emoji { font-size: 60px; text-align: center; margin: 8px 0; }

        .uvod-text {
            font-size: 18px;
            line-height: 1.5;
            color: #33261a;
            margin: 14px 4px 20px;
            text-align: center;
        }

        .btn {
            display: block;
            width: 100%;
            background: linear-gradient(180deg, var(--amber-svetla), var(--amber));
            color: #2a1a0d;
            border: none;
            padding: 15px 18px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px #96610f;
            transition: transform 0.08s, box-shadow 0.08s;
            touch-action: manipulation;
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 1px #96610f; }

        /* Okruh – uvítací obrazovka okruhu */
        .okruh-cislo {
            text-align: center;
            font-size: 18px;
            color: var(--amber);
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .okruh-nazev {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            color: var(--tmava);
            margin: 6px 0 18px;
        }

        /* Otázka */
        .okruh-lista {
            text-align: center;
            font-size: 15px;
            color: var(--amber);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .otazka-poradi {
            text-align: center;
            color: #8a6a4a;
            font-size: 15px;
            margin-bottom: 10px;
        }
        .otazka-text {
            font-size: 23px;
            font-weight: bold;
            color: #2a1a0d;
            text-align: center;
            line-height: 1.35;
            margin: 6px 0 18px;
        }

        .odpovedi { display: flex; flex-direction: column; gap: 11px; }
        .odpoved {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            text-align: left;
            background: #fff;
            border: 3px solid #e0c79a;
            border-radius: 14px;
            padding: 14px 15px;
            font-size: 19px;
            color: #2a1a0d;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .odpoved:hover:not(:disabled) { background: #fdeccb; }
        .odpoved:disabled { cursor: default; }
        .odpoved .pismeno {
            flex: 0 0 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--amber);
            color: #fff;
            font-weight: bold;
            font-size: 19px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .odpoved.spravne {
            background: #e6f5e6;
            border-color: var(--zelena);
        }
        .odpoved.spravne .pismeno { background: var(--zelena); }
        .odpoved.spatne {
            background: #fbe6e3;
            border-color: var(--cervena);
        }
        .odpoved.spatne .pismeno { background: var(--cervena); }

        .fakt {
            margin-top: 16px;
            background: #fff9db;
            border-left: 5px solid var(--amber);
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 17px;
            line-height: 1.45;
            color: #5a4420;
        }
        .fakt strong { color: var(--tmava); }

        .dalsi-btn { margin-top: 16px; }

        /* Souhrn */
        .grade-titul {
            font-size: 26px;
            font-weight: bold;
            color: var(--tmava);
            text-align: center;
            margin: 10px 6px;
            line-height: 1.35;
        }
        .vysledek-box {
            background: #fdeccb;
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            font-size: 20px;
            margin: 16px 0;
            color: var(--tmava);
        }
        .vysledek-box .velke-cislo {
            font-size: 46px;
            font-weight: bold;
            color: var(--zelena);
            display: block;
            margin: 4px 0;
        }
        .hidden { display: none; }

        /* --- Přehled okruhů na úvodu --- */
        .prehled-okruhu {
            background: #fdeccb;
            border-radius: 14px;
            padding: 12px 16px;
            margin: 4px 0 20px;
            text-align: left;
        }
        .prehled-nadpis {
            font-weight: bold;
            text-align: center;
            color: var(--tmava);
            margin-bottom: 8px;
            font-size: 16px;
        }
        .prehled-radek {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 7px 0;
            font-size: 17px;
            color: var(--tmava);
            border-top: 1px solid #e6cfa0;
        }
        .prehled-radek:first-of-type { border-top: none; }
        .prehled-emoji { font-size: 22px; flex: 0 0 26px; text-align: center; }
        .prehled-nazev { flex: 1; }
        .prehled-pocet { font-weight: bold; color: #8a6a4a; font-size: 14px; white-space: nowrap; }
    </style>
</head>
<body>
    <div class="kviz">
        <div class="horni-lista">
            <div class="skore-box" id="skore-box">🍺 Body: <span id="skore">0</span> / <span id="skore-max">0</span></div>
            <button class="mute-btn" id="mute-btn" onclick="toggleMute()" title="Zapnout/vypnout zvuk">🔊</button>
        </div>

        <!-- ÚVOD -->
        <div id="zona-uvod">
            <div class="velky-emoji">🍻🥃🎯</div>
            <h1 id="uvod-titulek">Hospodský kvíz</h1>
            <div class="podtitulek" id="uvod-podtitulek">Evě a přátelům na zahradu · 2. díl</div>
            <div class="uvod-text" id="uvod-text"></div>
            <div class="prehled-okruhu" id="prehled-okruhu"></div>
            <button class="btn" onclick="spustSolo()">Spustit kvíz 🍻</button>
        </div>

        <!-- ÚVOD OKRUHU -->
        <div id="zona-okruh" class="hidden">
            <div class="velky-emoji" id="okruh-emoji">🥕</div>
            <div class="okruh-cislo" id="okruh-cislo">Okruh 1</div>
            <div class="okruh-nazev" id="okruh-nazev"></div>
            <button class="btn" onclick="spustOkruh()">Do toho! 👉</button>
        </div>

        <!-- OTÁZKA -->
        <div id="zona-otazka" class="hidden">
            <div class="okruh-lista" id="q-okruh"></div>
            <div class="otazka-poradi" id="q-poradi"></div>
            <div class="otazka-text" id="q-text"></div>
            <div class="odpovedi" id="q-odpovedi"></div>
            <div class="fakt hidden" id="q-fakt"></div>
            <button class="btn dalsi-btn hidden" id="dalsi-btn" onclick="dalsiOtazka()">Další otázka 👉</button>
        </div>

        <!-- SOUHRN -->
        <div id="zona-souhrn" class="hidden">
            <div class="velky-emoji" id="souhrn-emoji">🏆</div>
            <div class="grade-titul" id="souhrn-titul"></div>
            <div id="souhrn-solo">
                <div class="vysledek-box">
                    Správně jste odpověděli
                    <span class="velke-cislo" id="souhrn-body">0</span>
                    z <strong id="souhrn-max">0</strong> otázek
                </div>
            </div>
            <button class="btn" onclick="hrajZnovu()">Hrát znovu 🔄</button>
        </div>
    </div>

    <script>
    /* =====================================================================
       ①  OTÁZKY – TADY SE DĚLÁ NOVÝ DÍL
       ---------------------------------------------------------------------
       Každý okruh má "nazev", "emoji" a seznam "otazky".
       Každá otázka:
         q        = znění otázky
         moznosti = pole odpovědí (klidně 2, 3 nebo 4)
         spravne  = pořadí správné odpovědi (POZOR: počítá se od 0!
                    první možnost = 0, druhá = 1, třetí = 2, čtvrtá = 3)
         fakt     = (nepovinné) zajímavost, ukáže se po odpovědi

       Nový víkendový díl uděláš tak, že tenhle soubor zkopíruješ,
       přejmenuješ (např. hanum-hospodsky-kviz-03.html) a přepíšeš
       otázky níže. Nic jiného měnit nemusíš.
    ===================================================================== */
    const KONFIG = {
        titulek: "Hospodský kvíz",
        podtitulek: "Evě a přátelům na zahradu · 2. díl",
        uvod: "Nalijte si, sedněte ke stolu a pusťte se do toho společně s přáteli. " +
              "Pět okruhů, spousta otázek – a za správnou odpověď zacinká odměna! 🔔",
    };

    const OKRUHY = [
        {
            nazev: "Zahrádka, sad a divné ovoce",
            emoji: "🥕",
            otazky: [
                { q: "Kdy se nejlépe sází ozimý česnek?",
                  moznosti: ["Na podzim", "V červnu", "V plném létě", "Nikdy – jen se seje"], spravne: 0,
                  fakt: "Ozimý česnek zasazený na podzim dá pak větší palice." },
                { q: "Reneta, Boskoopské a Croncelské jsou odrůdy:",
                  moznosti: ["Jablek", "Hrušek", "Švestek", "Angreštu"], spravne: 0,
                  fakt: "Staré, dnes už vzácné odrůdy jabloní." },
                { q: "Co je to „štěpování“ (roubování)?",
                  moznosti: ["Spojení ušlechtilé odrůdy s podnoží", "Hnojení stromu", "Zálivka na list", "Ochrana kmene proti mrazu"], spravne: 0,
                  fakt: "Roub ušlechtilé odrůdy sroste s kořeny podnože." },
                { q: "Čím je zvláštní dýně Hokkaido?",
                  moznosti: ["Slupka se dá jíst, nemusí se loupat", "Nemá vůbec semínka", "Roste na stromě", "Syrová je jedovatá"], spravne: 0,
                  fakt: "Její tenká slupka se povařením změkne a jí se s ní." },
                { q: "Které bobule z trnitého keře mají mnohem víc vitaminu C než citron?",
                  moznosti: ["Rakytník", "Borůvka", "Bílý rybíz", "Malina"], spravne: 0,
                  fakt: "Rakytník je vitaminová bomba, roste i v drsných podmínkách." },
                { q: "Mrkev, petržel a celer patří do stejné čeledi jako:",
                  moznosti: ["Kopr a fenykl", "Cibule a česnek", "Rajče a paprika", "Zelí a květák"], spravne: 0,
                  fakt: "Jsou to miříkovité (dříve okoličnaté) – voňavé bylinky i kořenová zelenina." },
                { q: "Proč se u tyčkových rajčat vylamují „zálistky“?",
                  moznosti: ["Aby síla šla do plodů, ne do listů", "Aby rostlina neuschla", "Kvůli barvě listů", "Aby přilákaly včely"], spravne: 0,
                  fakt: "Vylamování bočních výhonů zvyšuje úrodu i velikost plodů." },
                { q: "Grapefruit (grep) je vlastně kříženec:",
                  moznosti: ["Pomela a pomeranče", "Citronu a limetky", "Mandarinky a jablka", "Pomeranče a hrušky"], spravne: 0,
                  fakt: "Patří mezi citrusy a vznikl křížením pomela s pomerančem." },
                { q: "Fíkovník se dá u nás na zahradě přes zimu:",
                  moznosti: ["Udržet, když se chrání před mrazem", "Vůbec nedá udržet venku", "Pěstovat jen v Alpách", "Sklízet jen v Africe"], spravne: 0,
                  fakt: "Otužilé fíkovníky přezimují venku, na zimu se zabalí nebo přiryjí." },
                { q: "Kdy je pro stromek obvykle nejlepší výsadba?",
                  moznosti: ["Na podzim, do vlhké a ještě teplé půdy", "V červencovém vedru", "Za mrazu v lednu", "O poledni v létě"], spravne: 0,
                  fakt: "Na podzim stromek stihne do zimy zakořenit." },
            ],
        },
        {
            nazev: "Domácí zvířectvo",
            emoji: "🐔",
            otazky: [
                { q: "Jak dlouho se v dobrém chovu dožije králík domácí?",
                  moznosti: ["8–12 let", "Nanejvýš 2 roky", "Přes 20 let", "Jen půl roku"], spravne: 0,
                  fakt: "Při dobré péči se domácí králík dožije klidně přes deset let." },
                { q: "Kolik váží velké plemeno králíka (belgický obr)?",
                  moznosti: ["I přes 6 kg", "Kolem 1 kg", "Přes 20 kg", "Do 30 dekagramů"], spravne: 0,
                  fakt: "Obři se vzácně dostanou i přes 7 kg." },
                { q: "Podle čeho se u slepice pozná dobrá kondice a snáška?",
                  moznosti: ["Sytě červený, prokrvený hřebínek", "Bledý hřebínek", "Že vůbec nežere", "Že v noci nespí"], spravne: 0,
                  fakt: "Bledý hřebínek naopak značí, že slepice zrovna nesnáší." },
                { q: "Leghornka a Vlaška jsou:",
                  moznosti: ["Plemena slepic", "Plemena králíků", "Odrůdy kachen", "Druhy holubů"], spravne: 0,
                  fakt: "Obě jsou známá nosná plemena slepic." },
                { q: "Proč se prasata v horku ráda válejí v bahně?",
                  moznosti: ["Nemají potní žlázy a takhle se chladí", "Je to jejich potrava", "Loví v bahně žáby", "Značí si tak teritorium"], spravne: 0,
                  fakt: "Bahno je ochladí a chrání kůži před sluncem i hmyzem." },
                { q: "Kolik vajec zhruba snese husa za sezónu?",
                  moznosti: ["Kolem 30–50", "Přes 300", "Jen 2–3", "Přes 1000"], spravne: 0,
                  fakt: "Husa snáší mnohem méně než slepice, ale velká vejce." },
                { q: "Co je „podestýlka“ v kurníku nebo chlévě?",
                  moznosti: ["Vrstva slámy či hoblin na zemi", "Krmná směs", "Napáječka", "Nemoc drůbeže"], spravne: 0,
                  fakt: "Nasákne vlhkost a udrží čisto a teplo." },
                { q: "Co mají morče a králík společného?",
                  moznosti: ["Zuby jim rostou celý život a musí je obrušovat", "Oba jsou šelmy", "Oba snášejí vejce", "Oba patří mezi ptáky"], spravne: 0,
                  fakt: "Proto potřebují tvrdou potravu a klacíky na okusování." },
                { q: "Kachny a husy mají mezi prsty:",
                  moznosti: ["Plovací blány", "Ostré drápy jako kočka", "Malá kopýtka", "Přísavky"], spravne: 0,
                  fakt: "Blány jim slouží jako pádla ve vodě." },
                { q: "Proč kohout kokrhá?",
                  moznosti: ["Značí si teritorium – i přes den, nejen za rozbřesku", "Jen když má hlad", "Jen když prší", "Když snáší vejce"], spravne: 0,
                  fakt: "Hlídá si území a hejno, ozývá se během celého dne." },
            ],
        },
        {
            nazev: "Chata, příroda a houby",
            emoji: "🌲",
            otazky: [
                { q: "Kdy bývá nejlepší čas na sběr hřibů?",
                  moznosti: ["Konec léta a podzim po deštích", "Leden a únor", "Za sucha v červnu", "Jen brzy na jaře"], spravne: 0,
                  fakt: "Houby vyrazí po vydatných deštích, když je ještě teplo." },
                { q: "Kozák a křemenáč patří mezi:",
                  moznosti: ["Hřiby (mají rourky pod kloboukem)", "Muchomůrky", "Lišky", "Bedly"], spravne: 0,
                  fakt: "Spodní strana klobouku je houbovitá (rourkatá), ne lupenatá." },
                { q: "Kde roste václavka?",
                  moznosti: ["Na pařezech a kmenech (na dřevě)", "V trávě na louce", "Na písku u vody", "Přímo ve vodě"], spravne: 0,
                  fakt: "Je to dřevokazná houba; syrová je nestravitelná." },
                { q: "Muchomůrka červená (červená s bílými tečkami) je:",
                  moznosti: ["Jedovatá a omamná", "Výborná jedlá", "Léčivá k jídlu", "Bez chuti, ale zdravá"], spravne: 0,
                  fakt: "Klasická jedovatá houba z pohádek – k jídlu rozhodně ne." },
                { q: "Shazování paroží u srnců a jelenů probíhá:",
                  moznosti: ["Každý rok – naroste nové", "Jen jednou za život", "Nikdy, paroží zůstává", "Jednou za deset let"], spravne: 0,
                  fakt: "Staré paroží shodí a přes rok naroste nové, často větší." },
                { q: "Jak nejlépe odstranit přisáté klíště?",
                  moznosti: ["Co nejdřív ho vytáhnout pinzetou kývavým tahem", "Přelít olejem a čekat", "Rozmáčknout ho přímo na kůži", "Nechat ho samo odpadnout za týden"], spravne: 0,
                  fakt: "Čím dřív klíště zmizí, tím menší je riziko nákazy." },
                { q: "Čím se pravá liška liší od nejedlých dvojníků?",
                  moznosti: ["Lištnami sbíhajícími po nožce a ovocnou vůní", "Modrým kloboukem", "Rourkami místo lupenů", "Tím, že roste ve vodě"], spravne: 0,
                  fakt: "Pravá liška voní po meruňkách a lištny jí sbíhají dolů po nožce." },
                { q: "Netopýři se ve tmě orientují pomocí:",
                  moznosti: ["Echolokace (ultrazvuku)", "Čichu jako pes", "Nočního vidění jako sova", "Hvězd na obloze"], spravne: 0,
                  fakt: "Vysílají ultrazvuk a poslouchají jeho odraz od překážek." },
                { q: "Na které straně kmene roste mech obvykle víc?",
                  moznosti: ["Na severní (vlhčí a stinné)", "Na jižní", "Vždy jen u samé země", "Jen na špičce stromu"], spravne: 0,
                  fakt: "Pomůcka pro orientaci v lese – není ale stoprocentní." },
                { q: "Kde přibližně stojí slunce v pravé poledne?",
                  moznosti: ["Na jihu", "Na severu", "Na východě", "Na západě"], spravne: 0,
                  fakt: "Ráno vychází na východě, večer zapadá na západě." },
            ],
        },
        {
            nazev: "Panák pro zahřátí",
            emoji: "🥃",
            otazky: [
                { q: "Jak se jmenuje pálenka z hrušek?",
                  moznosti: ["Hruškovice", "Griotka", "Kontušovka", "Medovina"], spravne: 0,
                  fakt: "Nejvoňavější bývá hruškovice z odrůdy Williams." },
                { q: "Kvašením čeho vzniká medovina?",
                  moznosti: ["Medu s vodou", "Hroznů", "Obilí", "Brambor"], spravne: 0,
                  fakt: "Je to jeden z nejstarších alkoholických nápojů vůbec." },
                { q: "Kolik piva vypije Čech v průměru za rok (světový rekord)?",
                  moznosti: ["Kolem 130–140 litrů", "Asi 10 litrů", "Přes 500 litrů", "Sotva 2 litry"], spravne: 0,
                  fakt: "Česko dlouhodobě vede světový žebříček spotřeby piva." },
                { q: "Griotka je sladký likér s příchutí:",
                  moznosti: ["Višní", "Máty", "Kávy", "Anýzu"], spravne: 0,
                  fakt: "Tmavý višňový likér, oblíbený k zákusku." },
                { q: "Kterou bylinou je typický absinth („zelená víla“)?",
                  moznosti: ["Pelyňkem", "Heřmánkem", "Mátou", "Meduňkou"], spravne: 0,
                  fakt: "Pelyněk mu dává hořkost i pověstnou zelenou barvu." },
                { q: "Světlý ležák plzeňského typu je pivo:",
                  moznosti: ["Spodně kvašené", "Svrchně kvašené jako ale", "Nekvašené", "Kvašené vínem"], spravne: 0,
                  fakt: "Spodní kvašení a plzeňský typ (pils) proslavily české pivo." },
                { q: "Z čeho se vyrábí pravý rum?",
                  moznosti: ["Z cukrové třtiny (melasy)", "Z brambor", "Ze švestek", "Z jablek"], spravne: 0,
                  fakt: "Český „tuzemák“ je ale lihovina s aroma, ne pravý rum." },
                { q: "Co obsahuje vaječný likér (vaječňák) kromě lihu hlavně?",
                  moznosti: ["Žloutky a cukr", "Mléko a sůl", "Med a bylinky", "Jen ovoce"], spravne: 0,
                  fakt: "Je hustý a sladký díky utřeným žloutkům." },
                { q: "Co znamená, když je pálenka „hlavatá“?",
                  moznosti: ["Má špatně oddělený úkap a bolí z ní hlava", "Je slabá a jemná", "Je pěkně vyzrálá", "Je moc studená"], spravne: 0,
                  fakt: "Za kocovinu může přiboudlina ze špatně odděleného úkapu." },
                { q: "Jak se slivovice nejlépe podává?",
                  moznosti: ["Vychlazená, ale ne ledová (kolem 8–10 °C)", "Vařící horká", "Zmrzlá na kostce ledu", "Se sodou a citronem"], spravne: 0,
                  fakt: "Příliš studená ztratí vůni, moc teplá zase jen pálí." },
            ],
        },
        {
            nazev: "Hospodská vědomostní",
            emoji: "🇨🇿",
            otazky: [
                { q: "Kolik hráčů má na hřišti jeden fotbalový tým?",
                  moznosti: ["11", "10", "9", "12"], spravne: 0,
                  fakt: "Deset hráčů v poli a jeden brankář." },
                { q: "Které je druhé největší město Česka (moravská metropole)?",
                  moznosti: ["Brno", "Ostrava", "Plzeň", "Olomouc"], spravne: 0,
                  fakt: "Brno je po Praze druhé největší město republiky." },
                { q: "Kdo napsal Babičku?",
                  moznosti: ["Božena Němcová", "Karel Čapek", "Alois Jirásek", "Jan Neruda"], spravne: 0,
                  fakt: "Slavná kniha vyšla roku 1855." },
                { q: "Slovo „robot“ dal světu:",
                  moznosti: ["Karel Čapek (hra R.U.R.)", "Jára Cimrman", "Jan Werich", "Bedřich Smetana"], spravne: 0,
                  fakt: "Poprvé zaznělo v roce 1920; slovo vymyslel bratr Josef Čapek." },
                { q: "Které pohoří tvoří s Polskem hranici na severu a je na něm Sněžka?",
                  moznosti: ["Krkonoše", "Šumava", "Beskydy", "České středohoří"], spravne: 0,
                  fakt: "Sněžka i státní hranice vedou hřebenem Krkonoš." },
                { q: "Kde jsou uloženy české korunovační klenoty?",
                  moznosti: ["V katedrále sv. Víta na Pražském hradě", "Na Karlštejně", "V Národním muzeu", "Na Špilberku"], spravne: 0,
                  fakt: "Ke koruně vede sedm zámků a klíče drží sedm institucí." },
                { q: "Jak se jmenuje nejstarší a nejdelší česká dálnice (Praha–Brno)?",
                  moznosti: ["D1", "D5", "D8", "D11"], spravne: 0,
                  fakt: "Dálnice D1 se začala stavět už před druhou světovou válkou." },
                { q: "Co se slaví 28. října?",
                  moznosti: ["Vznik samostatného Československa (1918)", "Upálení Jana Husa", "Svátek svatého Václava", "Den vítězství"], spravne: 0,
                  fakt: "Státní svátek – vznik ČSR roku 1918." },
                { q: "Jára Cimrman je:",
                  moznosti: ["Vymyšlený český „génius“ z divadelní hry", "Skutečný vynálezce 19. století", "První kosmonaut", "Slavný malíř"], spravne: 0,
                  fakt: "Milovaná fiktivní postava, kterou v anketě volili i za největšího Čecha." },
                { q: "Nejníže položené místo Česka (hladina Labe u Hřenska) leží asi:",
                  moznosti: ["115 m nad mořem", "0 m – u moře", "500 m", "1000 m"], spravne: 0,
                  fakt: "Nejníže leží Labe u Hřenska, než odteče do Německa." },
            ],
        },
    ];

    /* =====================================================================
       ②  ENGINE – tady už nic měnit nemusíš.
    ===================================================================== */
    var okruhIndex = 0;
    var otazkaIndex = 0;
    var skore = 0;
    var celkemOtazek = OKRUHY.reduce(function(s, o){ return s + o.otazky.length; }, 0);
    var zodpovezeno = false;
    var spravnaPozice = 0;

    document.getElementById('skore-max').textContent = celkemOtazek;
    document.getElementById('souhrn-max').textContent = celkemOtazek;
    document.getElementById('uvod-titulek').textContent = KONFIG.titulek;
    document.getElementById('uvod-podtitulek').textContent = KONFIG.podtitulek;
    document.getElementById('uvod-text').textContent = KONFIG.uvod;

    // Přehled okruhů na úvodní obrazovce (generuje se sám z otázek)
    document.getElementById('prehled-okruhu').innerHTML =
        '<div class="prehled-nadpis">Co vás čeká – ' + OKRUHY.length + ' okruhů:</div>' +
        OKRUHY.map(function(o){
            return '<div class="prehled-radek">' +
                   '<span class="prehled-emoji">' + o.emoji + '</span>' +
                   '<span class="prehled-nazev">' + escapeHtml(o.nazev) + '</span>' +
                   '<span class="prehled-pocet">' + o.otazky.length + ' ot.</span>' +
                   '</div>';
        }).join('');

    function escapeHtml(s) {
        return String(s).replace(/[&<>"]/g, function(c){
            return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
        });
    }

    function ukazZonu(id) {
        ['zona-uvod','zona-okruh','zona-otazka','zona-souhrn'].forEach(function(z){
            document.getElementById(z).classList.add('hidden');
        });
        document.getElementById(id).classList.remove('hidden');
    }

    function spustSolo() {
        zvukInit();
        okruhIndex = 0; otazkaIndex = 0; skore = 0;
        document.getElementById('skore').textContent = '0';
        ukazOkruh();
    }

    /* ----- Průběh kvízu ----- */
    function ukazOkruh() {
        var o = OKRUHY[okruhIndex];
        document.getElementById('okruh-emoji').textContent = o.emoji;
        document.getElementById('okruh-cislo').textContent = 'Okruh ' + (okruhIndex + 1) + ' / ' + OKRUHY.length;
        document.getElementById('okruh-nazev').textContent = o.nazev;
        ukazZonu('zona-okruh');
    }

    function spustOkruh() {
        zvukResume();
        otazkaIndex = 0;
        ukazOtazku();
    }

    function ukazOtazku() {
        zodpovezeno = false;
        var o = OKRUHY[okruhIndex];
        var q = o.otazky[otazkaIndex];

        document.getElementById('q-okruh').textContent = o.emoji + ' ' + o.nazev;
        document.getElementById('q-poradi').textContent = 'Otázka ' + (otazkaIndex + 1) + ' z ' + o.otazky.length;
        document.getElementById('q-text').textContent = q.q;

        var box = document.getElementById('q-odpovedi');
        box.innerHTML = '';
        var pismena = ['A', 'B', 'C', 'D', 'E', 'F'];
        // Zamícháme pořadí odpovědí, aby správná nebyla pořád „A".
        var poradi = q.moznosti.map(function(_, i){ return i; });
        for (var mi = poradi.length - 1; mi > 0; mi--) {
            var mj = Math.floor(Math.random() * (mi + 1));
            var mt = poradi[mi]; poradi[mi] = poradi[mj]; poradi[mj] = mt;
        }
        spravnaPozice = poradi.indexOf(q.spravne);
        poradi.forEach(function(origIdx, pos){
            var btn = document.createElement('button');
            btn.className = 'odpoved';
            btn.innerHTML = '<span class="pismeno">' + pismena[pos] + '</span><span>' + q.moznosti[origIdx] + '</span>';
            btn.onclick = function(){ odpovez(pos); };
            box.appendChild(btn);
        });

        var faktEl = document.getElementById('q-fakt');
        faktEl.classList.add('hidden');
        faktEl.innerHTML = '';
        document.getElementById('dalsi-btn').classList.add('hidden');

        ukazZonu('zona-otazka');
    }

    function odpovez(vybrano) {
        if (zodpovezeno) return;
        zodpovezeno = true;

        var q = OKRUHY[okruhIndex].otazky[otazkaIndex];
        var tlacitka = document.getElementById('q-odpovedi').children;

        for (var i = 0; i < tlacitka.length; i++) {
            tlacitka[i].disabled = true;
            if (i === spravnaPozice) tlacitka[i].classList.add('spravne');
        }

        if (vybrano === spravnaPozice) {
            skore++;
            document.getElementById('skore').textContent = skore;
            zvukSpravne();
        } else {
            tlacitka[vybrano].classList.add('spatne');
            zvukSpatne();
        }

        if (q.fakt) {
            var faktEl = document.getElementById('q-fakt');
            faktEl.innerHTML = '<strong>Věděli jste?</strong> ' + q.fakt;
            faktEl.classList.remove('hidden');
        }

        var dalsi = document.getElementById('dalsi-btn');
        var jePosledni = (okruhIndex === OKRUHY.length - 1) &&
                         (otazkaIndex === OKRUHY[okruhIndex].otazky.length - 1);
        dalsi.textContent = jePosledni ? 'Zobrazit výsledek 🏁' : 'Další otázka 👉';
        dalsi.classList.remove('hidden');
    }

    function dalsiOtazka() {
        otazkaIndex++;
        if (otazkaIndex < OKRUHY[okruhIndex].otazky.length) {
            ukazOtazku();
        } else {
            okruhIndex++;
            if (okruhIndex < OKRUHY.length) {
                ukazOkruh();
            } else {
                ukazSouhrn();
            }
        }
    }

    function ukazSouhrn() {
        var emojiEl = document.getElementById('souhrn-emoji');
        var titulEl = document.getElementById('souhrn-titul');
        document.getElementById('souhrn-body').textContent = skore;

        var procenta = celkemOtazek > 0 ? (skore / celkemOtazek) : 0;
        var emoji, titul;
        if (procenta >= 0.9)      { emoji = '🏆'; titul = 'Hospodský přeborník! Další rundu platí ostatní!'; }
        else if (procenta >= 0.7) { emoji = '🍺'; titul = 'Ostřílený štamgast – klobouk dolů!'; }
        else if (procenta >= 0.5) { emoji = '🥃'; titul = 'Slušný výkon, panák byl zasloužený!'; }
        else if (procenta >= 0.3) { emoji = '😅'; titul = 'Ještě jeden fernet a příště to bude lepší!'; }
        else                      { emoji = '🤪'; titul = 'Dneska to byla spíš ta slivovička…'; }
        emojiEl.textContent = emoji;
        titulEl.textContent = titul;
        if (procenta >= 0.7) zvukFanfara();

        ukazZonu('zona-souhrn');
    }

    function hrajZnovu() {
        document.getElementById('skore').textContent = '0';
        ukazZonu('zona-uvod');
    }

    /* ---------------------------------------------------------------------
       ZVUK – generuje se přímo v prohlížeči (Web Audio API),
       žádné soubory nejsou potřeba.
    --------------------------------------------------------------------- */
    var audioCtx = null;
    var ztlumeno = false;

    function zvukInit() {
        if (!audioCtx) {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
            catch (e) { audioCtx = null; }
        }
        zvukResume();
    }
    function zvukResume() {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }
    function toggleMute() {
        ztlumeno = !ztlumeno;
        document.getElementById('mute-btn').textContent = ztlumeno ? '🔇' : '🔊';
    }
    function ton(freq, start, delka, typ, hlasitost) {
        if (!audioCtx || ztlumeno) return;
        var osc = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        osc.type = typ || 'sine';
        osc.frequency.value = freq;
        var t0 = audioCtx.currentTime + start;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(hlasitost || 0.25, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + delka);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(t0); osc.stop(t0 + delka + 0.02);
    }
    function zvukSpravne() {
        // veselé stoupavé „ta-da-dá"
        ton(523.25, 0.00, 0.15, 'triangle', 0.3); // C5
        ton(659.25, 0.12, 0.15, 'triangle', 0.3); // E5
        ton(783.99, 0.24, 0.28, 'triangle', 0.3); // G5
    }
    function zvukSpatne() {
        // krátké klesavé „mm-mm"
        ton(196.00, 0.00, 0.20, 'sawtooth', 0.18); // G3
        ton(155.56, 0.16, 0.28, 'sawtooth', 0.18); // Eb3
    }
    function zvukFanfara() {
        ton(523.25, 0.00, 0.16, 'triangle', 0.3);
        ton(659.25, 0.14, 0.16, 'triangle', 0.3);
        ton(783.99, 0.28, 0.16, 'triangle', 0.3);
        ton(1046.50, 0.42, 0.45, 'triangle', 0.32);
    }
    </script>
