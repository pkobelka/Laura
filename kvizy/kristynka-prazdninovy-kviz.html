<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prázdninový kvíz pro Kristýnku</title>
    <style>
        /* Veselá dětská paleta – chceš jinou? Stačí přepsat těchhle pár barev. */
        :root {
            --tmava: #15496f;
            --hlavni: #2f8fd6;
            --hlavni-svetla: #9bd8f7;
            --krem: #f2fbff;
            --zelena: #2e9e4f;
            --cervena: #e0574f;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 12px;
        }
        .kviz {
            background-color: var(--krem);
            width: 100%;
            max-width: 560px;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.35);
            border: 5px solid var(--hlavni);
            max-height: 96vh;
            overflow-y: auto;
            padding: 20px;
        }

        .horni-lista {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .skore-box {
            font-weight: bold;
            font-size: 17px;
            color: var(--tmava);
            background: #dff1fd;
            border: 2px dashed var(--hlavni);
            border-radius: 10px;
            padding: 6px 12px;
        }
        .skore-box span { color: var(--zelena); }
        .mute-btn {
            font-size: 22px;
            background: #dff1fd;
            border: 2px solid var(--hlavni);
            border-radius: 10px;
            width: 46px;
            height: 42px;
            cursor: pointer;
            line-height: 1;
        }

        h1 {
            color: var(--tmava);
            text-align: center;
            font-size: 27px;
            margin: 6px 0 4px;
        }
        .podtitulek {
            text-align: center;
            color: #4a6d85;
            font-size: 17px;
            margin-bottom: 14px;
        }
        .velky-emoji { font-size: 60px; text-align: center; margin: 8px 0; }

        .uvod-text {
            font-size: 18px;
            line-height: 1.5;
            color: #15496f;
            margin: 14px 4px 20px;
            text-align: center;
        }

        .btn {
            display: block;
            width: 100%;
            background: linear-gradient(180deg, var(--hlavni-svetla), var(--hlavni));
            color: #15496f;
            border: none;
            padding: 15px 18px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px #1c6ba8;
            transition: transform 0.08s, box-shadow 0.08s;
            touch-action: manipulation;
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 1px #1c6ba8; }

        /* Okruh – uvítací obrazovka okruhu */
        .okruh-cislo {
            text-align: center;
            font-size: 18px;
            color: var(--hlavni);
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .okruh-nazev {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            color: var(--tmava);
            margin: 6px 0 18px;
        }

        /* Otázka */
        .okruh-lista {
            text-align: center;
            font-size: 15px;
            color: var(--hlavni);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .otazka-poradi {
            text-align: center;
            color: #4a6d85;
            font-size: 15px;
            margin-bottom: 10px;
        }
        .otazka-text {
            font-size: 23px;
            font-weight: bold;
            color: #15496f;
            text-align: center;
            line-height: 1.35;
            margin: 6px 0 18px;
        }

        .odpovedi { display: flex; flex-direction: column; gap: 11px; }
        .odpoved {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            text-align: left;
            background: #fff;
            border: 3px solid #b9e0f5;
            border-radius: 14px;
            padding: 14px 15px;
            font-size: 19px;
            color: #15496f;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .odpoved:hover:not(:disabled) { background: #dff1fd; }
        .odpoved:disabled { cursor: default; }
        .odpoved .pismeno {
            flex: 0 0 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--hlavni);
            color: #fff;
            font-weight: bold;
            font-size: 19px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .odpoved.spravne {
            background: #e6f5e6;
            border-color: var(--zelena);
        }
        .odpoved.spravne .pismeno { background: var(--zelena); }
        .odpoved.spatne {
            background: #fbe6e3;
            border-color: var(--cervena);
        }
        .odpoved.spatne .pismeno { background: var(--cervena); }

        .fakt {
            margin-top: 16px;
            background: #fff9db;
            border-left: 5px solid var(--hlavni);
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 17px;
            line-height: 1.45;
            color: #4a5b2a;
        }
        .fakt strong { color: var(--tmava); }

        .dalsi-btn { margin-top: 16px; }

        /* Souhrn */
        .grade-titul {
            font-size: 26px;
            font-weight: bold;
            color: var(--tmava);
            text-align: center;
            margin: 10px 6px;
            line-height: 1.35;
        }
        .vysledek-box {
            background: #dff1fd;
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            font-size: 20px;
            margin: 16px 0;
            color: var(--tmava);
        }
        .vysledek-box .velke-cislo {
            font-size: 46px;
            font-weight: bold;
            color: var(--zelena);
            display: block;
            margin: 4px 0;
        }
        .hidden { display: none; }

        /* --- Přehled okruhů na úvodu --- */
        .prehled-okruhu {
            background: #dff1fd;
            border-radius: 14px;
            padding: 12px 16px;
            margin: 4px 0 20px;
            text-align: left;
        }
        .prehled-nadpis {
            font-weight: bold;
            text-align: center;
            color: var(--tmava);
            margin-bottom: 8px;
            font-size: 16px;
        }
        .prehled-radek {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 7px 0;
            font-size: 17px;
            color: var(--tmava);
            border-top: 1px solid #cbe7f7;
        }
        .prehled-radek:first-of-type { border-top: none; }
        .prehled-emoji { font-size: 22px; flex: 0 0 26px; text-align: center; }
        .prehled-nazev { flex: 1; }
        .prehled-pocet { font-weight: bold; color: #4a6d85; font-size: 14px; white-space: nowrap; }
    </style>
</head>
<body>
    <div class="kviz">
        <div class="horni-lista">
            <div class="skore-box" id="skore-box">⭐ Body: <span id="skore">0</span> / <span id="skore-max">0</span></div>
            <button class="mute-btn" id="mute-btn" onclick="toggleMute()" title="Zapnout/vypnout zvuk">🔊</button>
        </div>

        <!-- ÚVOD -->
        <div id="zona-uvod">
            <div class="velky-emoji">🎈🐬🚀</div>
            <h1 id="uvod-titulek">Prázdninový kvíz</h1>
            <div class="podtitulek" id="uvod-podtitulek">Kristýnce na prázdniny od dědy Peti</div>
            <div class="uvod-text" id="uvod-text"></div>
            <div class="prehled-okruhu" id="prehled-okruhu"></div>
            <button class="btn" onclick="spustSolo()">Jdeme na to! 🎈</button>
        </div>

        <!-- ÚVOD OKRUHU -->
        <div id="zona-okruh" class="hidden">
            <div class="velky-emoji" id="okruh-emoji">🐾</div>
            <div class="okruh-cislo" id="okruh-cislo">Okruh 1</div>
            <div class="okruh-nazev" id="okruh-nazev"></div>
            <button class="btn" onclick="spustOkruh()">Do toho! 👉</button>
        </div>

        <!-- OTÁZKA -->
        <div id="zona-otazka" class="hidden">
            <div class="okruh-lista" id="q-okruh"></div>
            <div class="otazka-poradi" id="q-poradi"></div>
            <div class="otazka-text" id="q-text"></div>
            <div class="odpovedi" id="q-odpovedi"></div>
            <div class="fakt hidden" id="q-fakt"></div>
            <button class="btn dalsi-btn hidden" id="dalsi-btn" onclick="dalsiOtazka()">Další otázka 👉</button>
        </div>

        <!-- SOUHRN -->
        <div id="zona-souhrn" class="hidden">
            <div class="velky-emoji" id="souhrn-emoji">🏆</div>
            <div class="grade-titul" id="souhrn-titul"></div>
            <div id="souhrn-solo">
                <div class="vysledek-box">
                    Správně jsi odpověděla
                    <span class="velke-cislo" id="souhrn-body">0</span>
                    z <strong id="souhrn-max">0</strong> otázek
                </div>
            </div>
            <button class="btn" onclick="hrajZnovu()">Hrát znovu 🔄</button>
        </div>
    </div>

    <script>
    /* =====================================================================
       ①  OTÁZKY – TADY SE DĚLÁ NOVÝ DÍL
       ---------------------------------------------------------------------
       Každý okruh má "nazev", "emoji" a seznam "otazky".
       Každá otázka:
         q        = znění otázky
         moznosti = pole odpovědí (klidně 2, 3 nebo 4)
         spravne  = pořadí správné odpovědi (POZOR: počítá se od 0!
                    první možnost = 0, druhá = 1, třetí = 2, čtvrtá = 3)
         fakt     = (nepovinné) zajímavost, ukáže se po odpovědi

       Odpovědi se míchají samy, takže správná není pořád „A" –
       klidně ji nech u všech otázek na prvním místě (spravne: 0).

       Nový díl uděláš tak, že tenhle soubor zkopíruješ, přejmenuješ
       (např. kristynka-prazdninovy-kviz-02.html) a přepíšeš otázky
       níže. Nic jiného měnit nemusíš.
    ===================================================================== */
    const KONFIG = {
        titulek: "Prázdninový kvíz",
        podtitulek: "Kristýnce na prázdniny od dědy Peti",
        uvod: "Ahoj Kristýnko! Prázdniny jsou od toho, aby byla legrace – tak jsem ti " +
              "připravil kvíz o zvířatech, o moři a horách, o vesmíru, o pohádkách " +
              "a nakonec i pár záludných hádanek. U každé otázky vyber odpověď, " +
              "která je podle tebe správná. Nic se neděje, když se spleteš – " +
              "aspoň se dozvíš něco nového. 😊",
    };

    const OKRUHY = [
        {
            nazev: "Zvířata a příroda",
            emoji: "🐾",
            otazky: [
                { q: "Které zvíře je největší na celém světě?",
                  moznosti: ["Plejtvák obrovský (velryba)", "Slon africký", "Žirafa", "Nosorožec"], spravne: 0,
                  fakt: "plejtvák může měřit přes 30 metrů – to je jako deset aut za sebou." },
                { q: "Kolik nohou má pavouk?",
                  moznosti: ["Osm", "Šest", "Deset", "Čtyři"], spravne: 0,
                  fakt: "hmyz (třeba moucha) má šest nohou, a proto pavouk mezi hmyz nepatří." },
                { q: "Co dělá ježek v zimě?",
                  moznosti: ["Spí zimním spánkem", "Odlétá do teplých krajin", "Loví ryby pod ledem", "Zbělá jako zajíc"], spravne: 0,
                  fakt: "ježek přes zimu spí a jeho srdce bije mnohem pomaleji než v létě." },
                { q: "Z čeho se vylíhne motýl?",
                  moznosti: ["Z kukly", "Z žaludu", "Z rybí jikry", "Z květu"], spravne: 0,
                  fakt: "napřed je vajíčko, z něj housenka, z housenky kukla – a teprve pak motýl." },
                { q: "Jak se říká mláděti koně?",
                  moznosti: ["Hříbě", "Tele", "Kůzle", "Sele"], spravne: 0,
                  fakt: "hříbě se postaví na nohy skoro hned po narození." },
                { q: "Který velký bílo‑černý pták u nás v létě hnízdí na komíně nebo na sloupu?",
                  moznosti: ["Čáp bílý", "Tučňák", "Pštros", "Papoušek"], spravne: 0,
                  fakt: "čápi na zimu odlétají až do Afriky a na jaře se vracejí do stejného hnízda." },
                { q: "Co potřebují rostliny, aby si vyrobily potravu?",
                  moznosti: ["Sluneční světlo a vodu", "Jenom tmu", "Mléko", "Písek"], spravne: 0,
                  fakt: "listy si ze slunce, vody a vzduchu vyrábějí cukr – říká se tomu fotosyntéza." },
                { q: "Z čeho včely vyrábějí med?",
                  moznosti: ["Z květového nektaru", "Z trávy", "Z vody z potoka", "Z pylu z komína"], spravne: 0,
                  fakt: "na jednu lžičku medu musí včelky navštívit i několik tisíc květů." },
            ],
        },
        {
            nazev: "Prázdniny u vody a v horách",
            emoji: "🏖️",
            otazky: [
                { q: "Která je nejvyšší hora Česka?",
                  moznosti: ["Sněžka", "Praděd", "Lysá hora", "Říp"], spravne: 0,
                  fakt: "Sněžka měří 1603 metrů a stojí na ní zvláštní kulatá budova." },
                { q: "Která řeka teče Prahou?",
                  moznosti: ["Vltava", "Labe", "Morava", "Dyje"], spravne: 0,
                  fakt: "Vltava je nejdelší česká řeka – měří přes 430 kilometrů." },
                { q: "Proč se v moři plave líp než v rybníce?",
                  moznosti: ["Slaná voda víc nadnáší", "Moře je hustší od písku", "Ve slané vodě jsou bublinky", "Moře je vždycky mělké"], spravne: 0,
                  fakt: "v Mrtvém moři je soli tolik, že si v něm můžeš ležet a číst si noviny." },
                { q: "Co si máš namazat, aby tě na pláži nespálilo slunce?",
                  moznosti: ["Opalovací krém", "Kečup", "Vodu z moře", "Nic, stačí ručník"], spravne: 0,
                  fakt: "spálit se můžeš i ve vodě a i když je zataženo – sluneční paprsky projdou skrz mraky." },
                { q: "Co znamená červená vlajka na pláži?",
                  moznosti: ["Zákaz koupání, je to nebezpečné", "Voda je teplá", "Je čas na oběd", "Blíží se lodička se zmrzlinou"], spravne: 0,
                  fakt: "zelená vlajka naopak znamená, že se koupat můžeš." },
                { q: "Které moře je od nás nejblíž?",
                  moznosti: ["Baltské", "Černé", "Rudé", "Karibské"], spravne: 0,
                  fakt: "Česko žádné moře nemá – je to vnitrozemský stát obklopený souší." },
                { q: "Kterým měsícem u nás začínají letní prázdniny?",
                  moznosti: ["Červencem", "Červnem", "Srpnem", "Zářím"], spravne: 0,
                  fakt: "prázdniny trvají dva měsíce – červenec a srpen." },
                { q: "Jak poznáš v lese sever, když nemáš kompas?",
                  moznosti: ["Podle mechu, roste víc na severní straně", "Podle mravenců, ti chodí jen na jih", "Podle barvy listí", "Podle větru"], spravne: 0,
                  fakt: "je to jen pomůcka, ne jistota – mech roste tam, kde je vlhko a stín." },
            ],
        },
        {
            nazev: "Vesmír",
            emoji: "🚀",
            otazky: [
                { q: "Kolik planet má naše Sluneční soustava?",
                  moznosti: ["Osm", "Devět", "Šest", "Dvanáct"], spravne: 0,
                  fakt: "Pluto se dřív počítalo taky, ale dnes se mu říká trpasličí planeta." },
                { q: "Co je Slunce?",
                  moznosti: ["Hvězda", "Planeta", "Měsíc", "Kometa"], spravne: 0,
                  fakt: "je to obrovská žhavá koule plynu – a je nám ze všech hvězd nejblíž." },
                { q: "Která planeta má kolem sebe nápadné prstence?",
                  moznosti: ["Saturn", "Mars", "Venuše", "Merkur"], spravne: 0,
                  fakt: "prstence jsou z kousků ledu a kamení, některé jsou velké jako dům." },
                { q: "Které planetě se říká „rudá planeta“?",
                  moznosti: ["Marsu", "Jupiteru", "Zemi", "Neptunu"], spravne: 0,
                  fakt: "Mars je červený od rezavého prachu, kterého je na něm plno." },
                { q: "Kdo jako první stanul na Měsíci?",
                  moznosti: ["Neil Armstrong", "Jurij Gagarin", "Vladimír Remek", "Isaac Newton"], spravne: 0,
                  fakt: "stalo se to v roce 1969 a jeho stopy jsou v měsíčním prachu dodnes." },
                { q: "Proč se na Měsíci skáče mnohem výš než na Zemi?",
                  moznosti: ["Míň nás přitahuje k povrchu", "Je tam víc vzduchu", "Je tam větší zima", "Měsíc se rychle otáčí"], spravne: 0,
                  fakt: "na Měsíci bys vážila asi šestkrát míň – proto astronauti poskakovali." },
                { q: "Jak dlouho letí sluneční světlo k Zemi?",
                  moznosti: ["Asi 8 minut", "Zlomek vteřiny", "Celý den", "Rok"], spravne: 0,
                  fakt: "když se podíváš na Slunce, vidíš vlastně, jak vypadalo před osmi minutami." },
                { q: "Jak se jmenuje první Čech, který letěl do vesmíru?",
                  moznosti: ["Vladimír Remek", "Jan Palach", "Emil Zátopek", "Jára Cimrman"], spravne: 0,
                  fakt: "letěl v roce 1978 a byl to vůbec první kosmonaut, který nebyl Rus ani Američan." },
            ],
        },
        {
            nazev: "Pohádky a příběhy",
            emoji: "📚",
            otazky: [
                { q: "Kdo v pohádce spolkl babičku Červené karkulky?",
                  moznosti: ["Vlk", "Medvěd", "Liška", "Drak"], spravne: 0,
                  fakt: "myslivec ji z vlkova břicha vysvobodil – v původní verzi to tak šťastně nedopadlo." },
                { q: "Co vyrostlo z ošklivého káčátka?",
                  moznosti: ["Krásná labuť", "Obrovská husa", "Páv", "Čáp"], spravne: 0,
                  fakt: "pohádku napsal Dán Hans Christian Andersen." },
                { q: "Kolik trpaslíků bydlelo v chaloupce se Sněhurkou?",
                  moznosti: ["Sedm", "Pět", "Devět", "Tři"], spravne: 0,
                  fakt: "trpaslíci pracovali v dole a Sněhurka jim vedla domácnost." },
                { q: "Komu se prodlužoval nos, když lhal?",
                  moznosti: ["Pinocchiovi", "Petrušce", "Otesánkovi", "Rumcajsovi"], spravne: 0,
                  fakt: "Pinocchio byl dřevěný panáček, kterého vyřezal truhlář Geppetto." },
                { q: "Jak se jmenuje kamarád mechového skřítka Křemílka?",
                  moznosti: ["Vochomůrka", "Rákosníček", "Bobík", "Hurvínek"], spravne: 0,
                  fakt: "bydlí spolu v pařezové chaloupce v lese." },
                { q: "Z čeho postavilo třetí prasátko domek, který vlk nesfoukl?",
                  moznosti: ["Z cihel", "Ze slámy", "Z proutí", "Z listí"], spravne: 0,
                  fakt: "sláma i proutí odletěly – cihly vydržely, protože se s nimi nejvíc nadřelo." },
                { q: "Kdo napsal a nakreslil Ferdu Mravence?",
                  moznosti: ["Ondřej Sekora", "Josef Lada", "Božena Němcová", "Karel Čapek"], spravne: 0,
                  fakt: "Ferdovo heslo je „Práce všeho druhu“ – a nosí puntíkovaný šátek." },
                { q: "Co dala víla Popelce, aby mohla jít na ples?",
                  moznosti: ["Krásné šaty a kočár", "Kouzelný meč", "Létající koberec", "Neviditelný plášť"], spravne: 0,
                  fakt: "v české pohádce Tři oříšky pro Popelku to zařídily tři kouzelné oříšky." },
            ],
        },
        {
            nazev: "Hádanky a chytrolínky",
            emoji: "🤔",
            otazky: [
                { q: "Co je těžší – kilo peří, nebo kilo železa?",
                  moznosti: ["Váží stejně", "Železo", "Peří", "Nedá se to porovnat"], spravne: 0,
                  fakt: "kilo je vždycky kilo – peří jenom zabere mnohem víc místa." },
                { q: "Kolik měsíců v roce má aspoň 28 dní?",
                  moznosti: ["Všech dvanáct", "Jeden", "Dva", "Sedm"], spravne: 0,
                  fakt: "únor jich má 28 (v přestupném roce 29) a ostatní ještě víc." },
                { q: "Otec Marušky má čtyři dcery: Jaro, Léto, Podzim a…?",
                  moznosti: ["Marušku", "Zimu", "Vánoce", "Neděli"], spravne: 0,
                  fakt: "čtvrtá dcera je přece Maruška – je to hned na začátku hádanky." },
                { q: "Kolik minut má hodina a půl?",
                  moznosti: ["90 minut", "60 minut", "100 minut", "120 minut"], spravne: 0,
                  fakt: "hodina má 60 minut, půlhodina 30 – dohromady tedy 90." },
                { q: "Co roste hlavou dolů?",
                  moznosti: ["Rampouch", "Slunečnice", "Dub", "Houba"], spravne: 0,
                  fakt: "rampouch přirůstá dole, jak po něm stéká a mrzne voda." },
                { q: "Co má očka, ale nevidí?",
                  moznosti: ["Brambora", "Sova", "Zrcadlo", "Mrkev"], spravne: 0,
                  fakt: "z bramborových oček vyrůstají klíčky, když je necháš dlouho ve spíži." },
                { q: "Na ryby šli dva otcové a dva synové, chytli tři ryby a každý si jednu odnesl. Jak je to možné?",
                  moznosti: ["Byli jenom tři: děda, táta a syn", "Jednu rybu si rozdělili", "Jeden si vzal dvě", "Někdo lže"], spravne: 0,
                  fakt: "táta je zároveň syn dědy – proto jsou to dva otcové i dva synové." },
                { q: "Máš pět jablek a dvě sníš. Kolik jablek ti zbude?",
                  moznosti: ["Tři", "Dvě", "Pět", "Sedm"], spravne: 0,
                  fakt: "kdyby se ale ptali, kolik jich máš, jsou to pořád ta dvě v bříšku a tři v košíku. 😄" },
            ],
        },
    ];

    /* =====================================================================
       ②  ENGINE – tady už nic měnit nemusíš.
    ===================================================================== */
    var okruhIndex = 0;
    var otazkaIndex = 0;
    var skore = 0;
    var celkemOtazek = OKRUHY.reduce(function(s, o){ return s + o.otazky.length; }, 0);
    var zodpovezeno = false;
    var spravnaPozice = 0;

    document.getElementById('skore-max').textContent = celkemOtazek;
    document.getElementById('souhrn-max').textContent = celkemOtazek;
    document.getElementById('uvod-titulek').textContent = KONFIG.titulek;
    document.getElementById('uvod-podtitulek').textContent = KONFIG.podtitulek;
    document.getElementById('uvod-text').textContent = KONFIG.uvod;

    // Přehled okruhů na úvodní obrazovce (generuje se sám z otázek)
    document.getElementById('prehled-okruhu').innerHTML =
        '<div class="prehled-nadpis">Co tě čeká – ' + OKRUHY.length + ' okruhů:</div>' +
        OKRUHY.map(function(o){
            return '<div class="prehled-radek">' +
                   '<span class="prehled-emoji">' + o.emoji + '</span>' +
                   '<span class="prehled-nazev">' + escapeHtml(o.nazev) + '</span>' +
                   '<span class="prehled-pocet">' + o.otazky.length + ' ot.</span>' +
                   '</div>';
        }).join('');

    function escapeHtml(s) {
        return String(s).replace(/[&<>"]/g, function(c){
            return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
        });
    }

    function ukazZonu(id) {
        ['zona-uvod','zona-okruh','zona-otazka','zona-souhrn'].forEach(function(z){
            document.getElementById(z).classList.add('hidden');
        });
        document.getElementById(id).classList.remove('hidden');
    }

    function spustSolo() {
        zvukInit();
        okruhIndex = 0; otazkaIndex = 0; skore = 0;
        document.getElementById('skore').textContent = '0';
        ukazOkruh();
    }

    /* ----- Průběh kvízu ----- */
    function ukazOkruh() {
        var o = OKRUHY[okruhIndex];
        document.getElementById('okruh-emoji').textContent = o.emoji;
        document.getElementById('okruh-cislo').textContent = 'Okruh ' + (okruhIndex + 1) + ' / ' + OKRUHY.length;
        document.getElementById('okruh-nazev').textContent = o.nazev;
        ukazZonu('zona-okruh');
    }

    function spustOkruh() {
        zvukResume();
        otazkaIndex = 0;
        ukazOtazku();
    }

    function ukazOtazku() {
        zodpovezeno = false;
        var o = OKRUHY[okruhIndex];
        var q = o.otazky[otazkaIndex];

        document.getElementById('q-okruh').textContent = o.emoji + ' ' + o.nazev;
        document.getElementById('q-poradi').textContent = 'Otázka ' + (otazkaIndex + 1) + ' z ' + o.otazky.length;
        document.getElementById('q-text').textContent = q.q;

        var box = document.getElementById('q-odpovedi');
        box.innerHTML = '';
        var pismena = ['A', 'B', 'C', 'D', 'E', 'F'];
        // Zamícháme pořadí odpovědí, aby správná nebyla pořád „A".
        var poradi = q.moznosti.map(function(_, i){ return i; });
        for (var mi = poradi.length - 1; mi > 0; mi--) {
            var mj = Math.floor(Math.random() * (mi + 1));
            var mt = poradi[mi]; poradi[mi] = poradi[mj]; poradi[mj] = mt;
        }
        spravnaPozice = poradi.indexOf(q.spravne);
        poradi.forEach(function(origIdx, pos){
            var btn = document.createElement('button');
            btn.className = 'odpoved';
            btn.innerHTML = '<span class="pismeno">' + pismena[pos] + '</span><span>' + q.moznosti[origIdx] + '</span>';
            btn.onclick = function(){ odpovez(pos); };
            box.appendChild(btn);
        });

        var faktEl = document.getElementById('q-fakt');
        faktEl.classList.add('hidden');
        faktEl.innerHTML = '';
        document.getElementById('dalsi-btn').classList.add('hidden');

        ukazZonu('zona-otazka');
    }

    function odpovez(vybrano) {
        if (zodpovezeno) return;
        zodpovezeno = true;

        var q = OKRUHY[okruhIndex].otazky[otazkaIndex];
        var tlacitka = document.getElementById('q-odpovedi').children;

        for (var i = 0; i < tlacitka.length; i++) {
            tlacitka[i].disabled = true;
            if (i === spravnaPozice) tlacitka[i].classList.add('spravne');
        }

        if (vybrano === spravnaPozice) {
            skore++;
            document.getElementById('skore').textContent = skore;
            zvukSpravne();
        } else {
            tlacitka[vybrano].classList.add('spatne');
            zvukSpatne();
        }

        if (q.fakt) {
            var faktEl = document.getElementById('q-fakt');
            faktEl.innerHTML = '<strong>Věděla jsi, že…</strong> ' + q.fakt;
            faktEl.classList.remove('hidden');
        }

        var dalsi = document.getElementById('dalsi-btn');
        var jePosledni = (okruhIndex === OKRUHY.length - 1) &&
                         (otazkaIndex === OKRUHY[okruhIndex].otazky.length - 1);
        dalsi.textContent = jePosledni ? 'Zobrazit výsledek 🏁' : 'Další otázka 👉';
        dalsi.classList.remove('hidden');
    }

    function dalsiOtazka() {
        otazkaIndex++;
        if (otazkaIndex < OKRUHY[okruhIndex].otazky.length) {
            ukazOtazku();
        } else {
            okruhIndex++;
            if (okruhIndex < OKRUHY.length) {
                ukazOkruh();
            } else {
                ukazSouhrn();
            }
        }
    }

    function ukazSouhrn() {
        var emojiEl = document.getElementById('souhrn-emoji');
        var titulEl = document.getElementById('souhrn-titul');
        document.getElementById('souhrn-body').textContent = skore;

        var procenta = celkemOtazek > 0 ? (skore / celkemOtazek) : 0;
        var emoji, titul;
        if (procenta >= 0.9)      { emoji = '🏆'; titul = 'Prázdninová šampionka! Klobouk dolů, Kristýnko!'; }
        else if (procenta >= 0.7) { emoji = '🌟'; titul = 'Paráda! Máš v hlavičce pořádný poklad.'; }
        else if (procenta >= 0.5) { emoji = '😊'; titul = 'Pěkný výkon – a pár novinek ses ještě přiučila!'; }
        else if (procenta >= 0.3) { emoji = '🙂'; titul = 'Dobrý začátek! Zkus to znovu, půjde to líp.'; }
        else                      { emoji = '🐣'; titul = 'Nevadí! Teď už spoustu odpovědí znáš – dej si to ještě jednou.'; }
        emojiEl.textContent = emoji;
        titulEl.textContent = titul;
        if (procenta >= 0.7) zvukFanfara();

        ukazZonu('zona-souhrn');
    }

    function hrajZnovu() {
        document.getElementById('skore').textContent = '0';
        ukazZonu('zona-uvod');
    }

    /* ---------------------------------------------------------------------
       ZVUK – generuje se přímo v prohlížeči (Web Audio API),
       žádné soubory nejsou potřeba.
    --------------------------------------------------------------------- */
    var audioCtx = null;
    var ztlumeno = false;

    function zvukInit() {
        if (!audioCtx) {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
            catch (e) { audioCtx = null; }
        }
        zvukResume();
    }
    function zvukResume() {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }
    function toggleMute() {
        ztlumeno = !ztlumeno;
        document.getElementById('mute-btn').textContent = ztlumeno ? '🔇' : '🔊';
    }
    function ton(freq, start, delka, typ, hlasitost) {
        if (!audioCtx || ztlumeno) return;
        var osc = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        osc.type = typ || 'sine';
        osc.frequency.value = freq;
        var t0 = audioCtx.currentTime + start;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(hlasitost || 0.25, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + delka);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(t0); osc.stop(t0 + delka + 0.02);
    }
    function zvukSpravne() {
        // veselé stoupavé „ta-da-dá"
        ton(523.25, 0.00, 0.15, 'triangle', 0.3); // C5
        ton(659.25, 0.12, 0.15, 'triangle', 0.3); // E5
        ton(783.99, 0.24, 0.28, 'triangle', 0.3); // G5
    }
    function zvukSpatne() {
        // krátké klesavé „mm-mm"
        ton(196.00, 0.00, 0.20, 'sawtooth', 0.18); // G3
        ton(155.56, 0.16, 0.28, 'sawtooth', 0.18); // Eb3
    }
    function zvukFanfara() {
        ton(523.25, 0.00, 0.16, 'triangle', 0.3);
        ton(659.25, 0.14, 0.16, 'triangle', 0.3);
        ton(783.99, 0.28, 0.16, 'triangle', 0.3);
        ton(1046.50, 0.42, 0.45, 'triangle', 0.32);
    }
    </script>
</body>
