<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospodský kvíz – Evě a přátelům (5. díl)</title>
    <style>
        :root {
            --tmava: #3a2417;
            --amber: #c8811a;
            --amber-svetla: #f0b850;
            --krem: #fff7e9;
            --zelena: #3f8f3f;
            --cervena: #c0392b;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #7a4a22 0%, #3a2417 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 12px;
        }
        .kviz {
            background-color: var(--krem);
            width: 100%;
            max-width: 560px;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.35);
            border: 5px solid var(--amber);
            max-height: 96vh;
            overflow-y: auto;
            padding: 20px;
        }

        .horni-lista {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .skore-box {
            font-weight: bold;
            font-size: 17px;
            color: var(--tmava);
            background: #fdeccb;
            border: 2px dashed var(--amber);
            border-radius: 10px;
            padding: 6px 12px;
        }
        .skore-box span { color: var(--zelena); }
        .mute-btn {
            font-size: 22px;
            background: #fdeccb;
            border: 2px solid var(--amber);
            border-radius: 10px;
            width: 46px;
            height: 42px;
            cursor: pointer;
            line-height: 1;
        }

        h1 {
            color: var(--tmava);
            text-align: center;
            font-size: 27px;
            margin: 6px 0 4px;
        }
        .podtitulek {
            text-align: center;
            color: #7a5a3a;
            font-size: 17px;
            margin-bottom: 14px;
        }
        .velky-emoji { font-size: 60px; text-align: center; margin: 8px 0; }

        .uvod-text {
            font-size: 18px;
            line-height: 1.5;
            color: #33261a;
            margin: 14px 4px 20px;
            text-align: center;
        }

        .btn {
            display: block;
            width: 100%;
            background: linear-gradient(180deg, var(--amber-svetla), var(--amber));
            color: #2a1a0d;
            border: none;
            padding: 15px 18px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px #96610f;
            transition: transform 0.08s, box-shadow 0.08s;
            touch-action: manipulation;
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 1px #96610f; }

        /* Okruh – uvítací obrazovka okruhu */
        .okruh-cislo {
            text-align: center;
            font-size: 18px;
            color: var(--amber);
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .okruh-nazev {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            color: var(--tmava);
            margin: 6px 0 18px;
        }

        /* Otázka */
        .okruh-lista {
            text-align: center;
            font-size: 15px;
            color: var(--amber);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .otazka-poradi {
            text-align: center;
            color: #8a6a4a;
            font-size: 15px;
            margin-bottom: 10px;
        }
        .otazka-text {
            font-size: 23px;
            font-weight: bold;
            color: #2a1a0d;
            text-align: center;
            line-height: 1.35;
            margin: 6px 0 18px;
        }

        .odpovedi { display: flex; flex-direction: column; gap: 11px; }
        .odpoved {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            text-align: left;
            background: #fff;
            border: 3px solid #e0c79a;
            border-radius: 14px;
            padding: 14px 15px;
            font-size: 19px;
            color: #2a1a0d;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .odpoved:hover:not(:disabled) { background: #fdeccb; }
        .odpoved:disabled { cursor: default; }
        .odpoved .pismeno {
            flex: 0 0 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--amber);
            color: #fff;
            font-weight: bold;
            font-size: 19px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .odpoved.spravne {
            background: #e6f5e6;
            border-color: var(--zelena);
        }
        .odpoved.spravne .pismeno { background: var(--zelena); }
        .odpoved.spatne {
            background: #fbe6e3;
            border-color: var(--cervena);
        }
        .odpoved.spatne .pismeno { background: var(--cervena); }

        .fakt {
            margin-top: 16px;
            background: #fff9db;
            border-left: 5px solid var(--amber);
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 17px;
            line-height: 1.45;
            color: #5a4420;
        }
        .fakt strong { color: var(--tmava); }

        .dalsi-btn { margin-top: 16px; }

        /* Souhrn */
        .grade-titul {
            font-size: 26px;
            font-weight: bold;
            color: var(--tmava);
            text-align: center;
            margin: 10px 6px;
            line-height: 1.35;
        }
        .vysledek-box {
            background: #fdeccb;
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            font-size: 20px;
            margin: 16px 0;
            color: var(--tmava);
        }
        .vysledek-box .velke-cislo {
            font-size: 46px;
            font-weight: bold;
            color: var(--zelena);
            display: block;
            margin: 4px 0;
        }
        .hidden { display: none; }

        /* --- Přehled okruhů na úvodu --- */
        .prehled-okruhu {
            background: #fdeccb;
            border-radius: 14px;
            padding: 12px 16px;
            margin: 4px 0 20px;
            text-align: left;
        }
        .prehled-nadpis {
            font-weight: bold;
            text-align: center;
            color: var(--tmava);
            margin-bottom: 8px;
            font-size: 16px;
        }
        .prehled-radek {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 7px 0;
            font-size: 17px;
            color: var(--tmava);
            border-top: 1px solid #e6cfa0;
        }
        .prehled-radek:first-of-type { border-top: none; }
        .prehled-emoji { font-size: 22px; flex: 0 0 26px; text-align: center; }
        .prehled-nazev { flex: 1; }
        .prehled-pocet { font-weight: bold; color: #8a6a4a; font-size: 14px; white-space: nowrap; }
    </style>
</head>
<body>
    <div class="kviz">
        <div class="horni-lista">
            <div class="skore-box" id="skore-box">🍺 Body: <span id="skore">0</span> / <span id="skore-max">0</span></div>
            <button class="mute-btn" id="mute-btn" onclick="toggleMute()" title="Zapnout/vypnout zvuk">🔊</button>
        </div>

        <!-- ÚVOD -->
        <div id="zona-uvod">
            <div class="velky-emoji">🍻🥃🎯</div>
            <h1 id="uvod-titulek">Hospodský kvíz</h1>
            <div class="podtitulek" id="uvod-podtitulek">Evě a přátelům na zahradu · 5. díl</div>
            <div class="uvod-text" id="uvod-text"></div>
            <div class="prehled-okruhu" id="prehled-okruhu"></div>
            <button class="btn" onclick="spustSolo()">Spustit kvíz 🍻</button>
        </div>

        <!-- ÚVOD OKRUHU -->
        <div id="zona-okruh" class="hidden">
            <div class="velky-emoji" id="okruh-emoji">🥕</div>
            <div class="okruh-cislo" id="okruh-cislo">Okruh 1</div>
            <div class="okruh-nazev" id="okruh-nazev"></div>
            <button class="btn" onclick="spustOkruh()">Do toho! 👉</button>
        </div>

        <!-- OTÁZKA -->
        <div id="zona-otazka" class="hidden">
            <div class="okruh-lista" id="q-okruh"></div>
            <div class="otazka-poradi" id="q-poradi"></div>
            <div class="otazka-text" id="q-text"></div>
            <div class="odpovedi" id="q-odpovedi"></div>
            <div class="fakt hidden" id="q-fakt"></div>
            <button class="btn dalsi-btn hidden" id="dalsi-btn" onclick="dalsiOtazka()">Další otázka 👉</button>
        </div>

        <!-- SOUHRN -->
        <div id="zona-souhrn" class="hidden">
            <div class="velky-emoji" id="souhrn-emoji">🏆</div>
            <div class="grade-titul" id="souhrn-titul"></div>
            <div id="souhrn-solo">
                <div class="vysledek-box">
                    Správně jste odpověděli
                    <span class="velke-cislo" id="souhrn-body">0</span>
                    z <strong id="souhrn-max">0</strong> otázek
                </div>
            </div>
            <button class="btn" onclick="hrajZnovu()">Hrát znovu 🔄</button>
        </div>
    </div>

    <script>
    /* =====================================================================
       ①  OTÁZKY – TADY SE DĚLÁ NOVÝ DÍL
       ---------------------------------------------------------------------
       Každý okruh má "nazev", "emoji" a seznam "otazky".
       Každá otázka:
         q        = znění otázky
         moznosti = pole odpovědí (klidně 2, 3 nebo 4)
         spravne  = pořadí správné odpovědi (POZOR: počítá se od 0!
                    první možnost = 0, druhá = 1, třetí = 2, čtvrtá = 3)
         fakt     = (nepovinné) zajímavost, ukáže se po odpovědi

       Nový víkendový díl uděláš tak, že tenhle soubor zkopíruješ,
       přejmenuješ (např. hanum-hospodsky-kviz-03.html) a přepíšeš
       otázky níže. Nic jiného měnit nemusíš.
    ===================================================================== */
    const KONFIG = {
        titulek: "Hospodský kvíz",
        podtitulek: "Evě a přátelům na zahradu · 5. díl",
        uvod: "Nalijte si, sedněte ke stolu a pusťte se do toho společně s přáteli. " +
              "Pět okruhů, spousta otázek – a za správnou odpověď zacinká odměna! 🔔",
    };

    const OKRUHY = [
        {
            nazev: "Zahrádka, sad a divné ovoce",
            emoji: "🥕",
            otazky: [
                { q: "Proč jsou ředkvičky oblíbené i u netrpělivých zahrádkářů?",
                  moznosti: ["Vyrostou za pár týdnů", "Plodí až po deseti letech", "Rostou jen ve skleníku", "Musí se roubovat"], spravne: 0,
                  fakt: "Rychlá zelenina, ideální i pro děti." },
                { q: "Co dělá mladá slunečnice přes den?",
                  moznosti: ["Otáčí se za sluncem", "Zavírá se do klubíčka", "Zahrabává se do země", "Nehýbe se vůbec"], spravne: 0,
                  fakt: "Dospělé úbory se pak ustálí směrem k východu." },
                { q: "Pór patří mezi:",
                  moznosti: ["Cibulovou zeleninu", "Kořenovou zeleninu", "Listovou jako salát", "Luštěniny"], spravne: 0,
                  fakt: "Je příbuzný cibule a česneku." },
                { q: "Vlašské ořechy rostou na:",
                  moznosti: ["Ořešáku (velkém stromě)", "Nízkém keři", "Révě", "Bramborové nati"], spravne: 0,
                  fakt: "Ořešák voní a odpuzuje i některý hmyz." },
                { q: "Meloun vodní patří (překvapivě) mezi:",
                  moznosti: ["Tykvovité", "Citrusy", "Ovocné stromy", "Lesní bobuloviny"], spravne: 0,
                  fakt: "Je příbuzný okurky a dýně." },
                { q: "Špenát a hlávkový salát jsou:",
                  moznosti: ["Listová zelenina", "Kořenová zelenina", "Luštěniny", "Cibuloviny"], spravne: 0,
                  fakt: "Jedí se hlavně jejich listy." },
                { q: "Proč se okurky pěstují u plotu nebo na síti?",
                  moznosti: ["Šplhají a plody nehnijí na zemi", "Bojí se světla", "Nepotřebují půdu", "Aby je nikdo neviděl"], spravne: 0,
                  fakt: "Popínavé okurky mají čistší a rovnější plody." },
                { q: "Jak se nejsnáz množí rybíz a angrešt?",
                  moznosti: ["Řízky (zapíchnutou větvičkou)", "Jen ze semene", "Roubováním na jabloň", "Cibulkami"], spravne: 0,
                  fakt: "Dřevitá větvička zapíchnutá na podzim do jara zakoření." },
                { q: "Které naše koření dozrává jako drobná semínka do chleba a pečiva?",
                  moznosti: ["Kmín", "Skořice", "Pepř", "Vanilka"], spravne: 0,
                  fakt: "Kmín patří ke klasické české kuchyni." },
                { q: "Kdy se sklízí dýně?",
                  moznosti: ["Na podzim, před prvními mrazy", "Brzy zjara", "V zimě pod sněhem", "Kdykoli, nezáleží"], spravne: 0,
                  fakt: "Uzrálá dýně pak vydrží skladovaná celé měsíce." },
            ],
        },
        {
            nazev: "Domácí zvířectvo",
            emoji: "🐔",
            otazky: [
                { q: "Jak se jmenuje mládě koně?",
                  moznosti: ["Hříbě", "Tele", "Sele", "Kůzle"], spravne: 0,
                  fakt: "Matkou je klisna, otcem hřebec." },
                { q: "K čemu se používá husí a kachní prachové peří?",
                  moznosti: ["Do peřin a bund (dobře hřeje)", "Jako palivo", "Na výrobu mléka", "Do betonu"], spravne: 0,
                  fakt: "Prachové peří je lehké a výborně izoluje." },
                { q: "Kolik oddílů (žaludků) má kráva?",
                  moznosti: ["Čtyři", "Jeden", "Deset", "Žádný"], spravne: 0,
                  fakt: "Bachor, čepec, kniha a slez." },
                { q: "Čím se zajíc liší od králíka?",
                  moznosti: ["Nehrabe nory a mláďata se rodí vidoucí", "Je mnohem menší", "Snáší vejce", "Žije ve vodě"], spravne: 0,
                  fakt: "Zajíček je hned osrstěný a čile utíká, králíček se rodí holý." },
                { q: "Osel je pověstný:",
                  moznosti: ["Vytrvalostí a hlasitým hýkáním", "Létáním", "Životem ve vodě", "Že snáší vejce"], spravne: 0,
                  fakt: "Kříženec osla a klisny je mula (mezek)." },
                { q: "Kdy se u nás tradičně peče krocan (krůta)?",
                  moznosti: ["O svátcích (Vánoce, Díkůvzdání)", "Na Velikonoce k pomlázce", "Jen v létě", "Nikdy"], spravne: 0,
                  fakt: "Krůtí maso je libové a slavnostní." },
                { q: "Kde se ovce cítí bezpečně?",
                  moznosti: ["Ve stádě, drží pohromadě", "Úplně samy", "Ve vodě", "Na stromě"], spravne: 0,
                  fakt: "Stádní pud je chrání před šelmami." },
                { q: "Čím je kachna užitečná na zahradě?",
                  moznosti: ["Sbírá slimáky a hmyz", "Ryje záhony", "Dává vlnu", "Hlídá jako pes"], spravne: 0,
                  fakt: "Kachny milují slimáky – zahradníkův pomocník." },
                { q: "Jak zní ovce?",

                { q: "Perličí a bažantí vejce jsou oproti slepičím:",
                  moznosti: ["Menší a s pevnější skořápkou", "Dvakrát větší", "Bez skořápky", "Čtverhranná"], spravne: 0,

        {
            nazev: "Chata, příroda a houby",
            emoji: "🌲",
            otazky: [

                  moznosti: ["Z bláta a slin", "Z vosku", "Ze sněhu", "Z kamení"], spravne: 0,
                  fakt: "Hnízdí pod okapy a ve stodolách, na zimu táhnou do Afriky." },
                { q: "Čím se mravenci brání?",
                  moznosti: ["Kyselinou mravenčí", "Žihadlem jako včela", "Zuby", "Ohněm"], spravne: 0,
                  fakt: "V mraveništi spolupracují jako jedna velká rodina." },
                { q: "Který komár saje krev?",
                  moznosti: ["Jen samička (kvůli vajíčkům)", "Jen sameček", "Oba stejně", "Žádný komár nesaje"], spravne: 0,
                  fakt: "Samci se živí jen nektarem." },
                { q: "Čím je ježek na zahradě užitečný?",
                  moznosti: ["Žere slimáky, hmyz a červy", "Okusuje kořínky", "Jí jen ovoce", "Spásá trávu"], spravne: 0,
                  fakt: "Je to vítaný pomocník, přes zimu ale spí." },
                { q: "Který strom má nápadně bílou kůru s tmavými proužky?",
                  moznosti: ["Bříza", "Dub", "Smrk", "Buk"], spravne: 0,
                  fakt: "Z břízy se na jaře získávala míza." },
                { q: "Na čem roste žampion, který se pěstuje ve sklepě?",
                  moznosti: ["Na kompostu / hnoji (ne na dřevě)", "Na živém stromě", "Ve vodě", "Na holé skále"], spravne: 0,
                  fakt: "Pěstírny ho pěstují na slámě s hnojem." },
                { q: "Kdy je pýchavka jedlá?",
                  moznosti: ["Dokud je uvnitř bílá a tuhá", "Až když zhnědne a práší", "Nikdy, je jedovatá", "Jen syrová"], spravne: 0,

                { q: "Co dělá netopýr přes den?",
                  moznosti: ["Visí hlavou dolů a spí", "Loví ryby", "Staví hnízdo z bláta", "Táhne na jih"], spravne: 0,

                { q: "Jak vzniká „čarodějný kruh“ hub v trávě?",

                { q: "Nejvyšší hora Šumavy je:",
                  moznosti: ["Plechý", "Sněžka", "Praděd", "Radhošť"], spravne: 0,
                  fakt: "Plechý měří 1 378 metrů." },

        },
        {
            nazev: "Panák pro zahřátí",
            emoji: "🥃",
            otazky: [
                { q: "Kolik alkoholu má nealkoholické pivo?",

                  moznosti: ["Teplá (svařená), hlavně v zimě", "Zmrzlá na kostce ledu", "S mlékem", "Se solí"], spravne: 0,

                { q: "Který z těchto nápojů NENÍ pálenka (destilát)?",
                  moznosti: ["Víno", "Slivovice", "Whisky", "Rum"], spravne: 0,
                  fakt: "Víno vzniká kvašením, nepálí se." },
                { q: "Co znamená „zapít panáka“?",
                  moznosti: ["Napít se po něm něčeho jiného", "Zaplatit ho", "Rozlít ho", "Nechat ho stát"], spravne: 0,

                { q: "K čemu slouží pivní tácek (podtácek)?",
                  moznosti: ["Pod sklenici a k počítání piv čárkami", "Jako talíř na jídlo", "Na chlazení piva", "Jako pokrývka hlavy"], spravne: 0,

                  fakt: "Likéry jsou sladší a méně palčivé než čisté pálenky." },
                { q: "Kolik procent alkoholu mívá silné pivo „speciál“?",
                  moznosti: ["Kolem 6 % a víc", "Kolem 1 %", "Přes 30 %", "0 %"], spravne: 0,
                  fakt: "Silné třináctky a speciály dají zabrat víc než desítka." },
                { q: "Sklenička na tvrdý alkohol se lidově nazývá:",
                  moznosti: ["Štamprle", "Půllitr", "Karafa", "Tácek"], spravne: 0,
                  fakt: "Kalíšek zhruba na půl deci pálenky." },
            ],
        },
        {
            nazev: "Hospodská vědomostní",
            emoji: "🇨🇿",
            otazky: [
                { q: "Kolik má Praha zhruba obyvatel?",
                  moznosti: ["Kolem 1,3 milionu", "Kolem 100 tisíc", "Kolem 5 milionů", "Kolem 10 tisíc"], spravne: 0,
                  fakt: "Je zdaleka největší město republiky." },
                { q: "Nad kterým městem stojí vysílač a rozhledna Ještěd?",
                  moznosti: ["Nad Libercem", "Nad Brnem", "Nad Olomoucí", "Nad Zlínem"], spravne: 0,
                  fakt: "Jeho tvar připomíná špičatý kužel." },
                { q: "Ve kterém městě se poprvé vyrobil kostkový cukr?",
                  moznosti: ["V Dačicích", "V Praze", "Ve Znojmě", "V Chebu"], spravne: 0,
                  fakt: "Dačický vynález z 19. století zná celý svět." },
                { q: "Světově proslulý hokejový brankář přezdívaný „Dominátor“:",
                  moznosti: ["Dominik Hašek", "Jaromír Jágr", "Petr Čech", "Emil Zátopek"], spravne: 0,
                  fakt: "Chytal pro Česko i v zámořské NHL." },
                { q: "Do kterého moře odtéká řeka Odra?",
                  moznosti: ["Do Baltského", "Do Černého", "Do Jaderského", "Do Středozemního"], spravne: 0,
                  fakt: "Labe teče do Severního moře, Morava k Dunaji a do Černého." },
                { q: "Kdo složil operu Prodaná nevěsta a cyklus Má vlast?",
                  moznosti: ["Bedřich Smetana", "Antonín Dvořák", "Leoš Janáček", "Bohuslav Martinů"], spravne: 0,
                  fakt: "Součástí Mé vlasti je i slavná Vltava." },
                { q: "Jak se jmenuje pohádkový vládce Krkonoš?",
                  moznosti: ["Krakonoš", "Rumcajs", "Vodník", "Hastrman"], spravne: 0,
                  fakt: "Přísný, ale spravedlivý pán hor." },
                { q: "Které moře je Česku (jako vnitrozemskému státu) nejblíž?",
                  moznosti: ["Baltské", "Jaderské", "Černé", "Středozemní"], spravne: 0,
                  fakt: "Od našich severních hranic je to k Baltu nejblíž." },
                { q: "Který běžec, „česká lokomotiva“, vyhrál na jedné olympiádě 5 km, 10 km i maraton?",
                  moznosti: ["Emil Zátopek", "Jaromír Jágr", "Roman Šebrle", "Jan Železný"], spravne: 0,
                  fakt: "Legendární výkon z Helsinek 1952." },
                { q: "Hlavní město sousedního Rakouska je:",
                  moznosti: ["Vídeň", "Salcburk", "Linec", "Štýrský Hradec"], spravne: 0,
                  fakt: "Leží na Dunaji, kousek od našich hranic." },
            ],
        },
    ];

    /* =====================================================================
       ②  ENGINE – tady už nic měnit nemusíš.
    ===================================================================== */
    var okruhIndex = 0;
    var otazkaIndex = 0;
    var skore = 0;
    var celkemOtazek = OKRUHY.reduce(function(s, o){ return s + o.otazky.length; }, 0);
    var zodpovezeno = false;
    var spravnaPozice = 0;

    document.getElementById('skore-max').textContent = celkemOtazek;
    document.getElementById('souhrn-max').textContent = celkemOtazek;
    document.getElementById('uvod-titulek').textContent = KONFIG.titulek;
    document.getElementById('uvod-podtitulek').textContent = KONFIG.podtitulek;
    document.getElementById('uvod-text').textContent = KONFIG.uvod;

    // Přehled okruhů na úvodní obrazovce (generuje se sám z otázek)
    document.getElementById('prehled-okruhu').innerHTML =
        '<div class="prehled-nadpis">Co vás čeká – ' + OKRUHY.length + ' okruhů:</div>' +
        OKRUHY.map(function(o){
            return '<div class="prehled-radek">' +
                   '<span class="prehled-emoji">' + o.emoji + '</span>' +
                   '<span class="prehled-nazev">' + escapeHtml(o.nazev) + '</span>' +
                   '<span class="prehled-pocet">' + o.otazky.length + ' ot.</span>' +
                   '</div>';
        }).join('');

    function escapeHtml(s) {
        return String(s).replace(/[&<>"]/g, function(c){
            return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
        });
    }

    function ukazZonu(id) {
        ['zona-uvod','zona-okruh','zona-otazka','zona-souhrn'].forEach(function(z){
            document.getElementById(z).classList.add('hidden');
        });
        document.getElementById(id).classList.remove('hidden');
    }

    function spustSolo() {
        zvukInit();
        okruhIndex = 0; otazkaIndex = 0; skore = 0;
        document.getElementById('skore').textContent = '0';
        ukazOkruh();
    }

    /* ----- Průběh kvízu ----- */
    function ukazOkruh() {
        var o = OKRUHY[okruhIndex];
        document.getElementById('okruh-emoji').textContent = o.emoji;
        document.getElementById('okruh-cislo').textContent = 'Okruh ' + (okruhIndex + 1) + ' / ' + OKRUHY.length;
        document.getElementById('okruh-nazev').textContent = o.nazev;
        ukazZonu('zona-okruh');
    }

    function spustOkruh() {
        zvukResume();
        otazkaIndex = 0;
        ukazOtazku();
    }

    function ukazOtazku() {
        zodpovezeno = false;
        var o = OKRUHY[okruhIndex];
        var q = o.otazky[otazkaIndex];

        document.getElementById('q-okruh').textContent = o.emoji + ' ' + o.nazev;
        document.getElementById('q-poradi').textContent = 'Otázka ' + (otazkaIndex + 1) + ' z ' + o.otazky.length;
        document.getElementById('q-text').textContent = q.q;

        var box = document.getElementById('q-odpovedi');
        box.innerHTML = '';
        var pismena = ['A', 'B', 'C', 'D', 'E', 'F'];
        // Zamícháme pořadí odpovědí, aby správná nebyla pořád „A".
        var poradi = q.moznosti.map(function(_, i){ return i; });
        for (var mi = poradi.length - 1; mi > 0; mi--) {
            var mj = Math.floor(Math.random() * (mi + 1));
            var mt = poradi[mi]; poradi[mi] = poradi[mj]; poradi[mj] = mt;
        }
        spravnaPozice = poradi.indexOf(q.spravne);
        poradi.forEach(function(origIdx, pos){
            var btn = document.createElement('button');
            btn.className = 'odpoved';
            btn.innerHTML = '<span class="pismeno">' + pismena[pos] + '</span><span>' + q.moznosti[origIdx] + '</span>';
            btn.onclick = function(){ odpovez(pos); };
            box.appendChild(btn);
        });

        var faktEl = document.getElementById('q-fakt');
        faktEl.classList.add('hidden');
        faktEl.innerHTML = '';
        document.getElementById('dalsi-btn').classList.add('hidden');

        ukazZonu('zona-otazka');
    }

    function odpovez(vybrano) {
        if (zodpovezeno) return;
        zodpovezeno = true;

        var q = OKRUHY[okruhIndex].otazky[otazkaIndex];
        var tlacitka = document.getElementById('q-odpovedi').children;

        for (var i = 0; i < tlacitka.length; i++) {
            tlacitka[i].disabled = true;
            if (i === spravnaPozice) tlacitka[i].classList.add('spravne');
        }

        if (vybrano === spravnaPozice) {
            skore++;
            document.getElementById('skore').textContent = skore;
            zvukSpravne();
        } else {
            tlacitka[vybrano].classList.add('spatne');
            zvukSpatne();
        }

        if (q.fakt) {
            var faktEl = document.getElementById('q-fakt');
            faktEl.innerHTML = '<strong>Věděli jste?</strong> ' + q.fakt;
            faktEl.classList.remove('hidden');
        }

        var dalsi = document.getElementById('dalsi-btn');
        var jePosledni = (okruhIndex === OKRUHY.length - 1) &&
                         (otazkaIndex === OKRUHY[okruhIndex].otazky.length - 1);
        dalsi.textContent = jePosledni ? 'Zobrazit výsledek 🏁' : 'Další otázka 👉';
        dalsi.classList.remove('hidden');
    }

    function dalsiOtazka() {
        otazkaIndex++;
        if (otazkaIndex < OKRUHY[okruhIndex].otazky.length) {
            ukazOtazku();
        } else {
            okruhIndex++;
            if (okruhIndex < OKRUHY.length) {
                ukazOkruh();
            } else {
                ukazSouhrn();
            }
        }
    }

    function ukazSouhrn() {
        var emojiEl = document.getElementById('souhrn-emoji');
        var titulEl = document.getElementById('souhrn-titul');
        document.getElementById('souhrn-body').textContent = skore;

        var procenta = celkemOtazek > 0 ? (skore / celkemOtazek) : 0;
        var emoji, titul;
        if (procenta >= 0.9)      { emoji = '🏆'; titul = 'Hospodský přeborník! Další rundu platí ostatní!'; }
        else if (procenta >= 0.7) { emoji = '🍺'; titul = 'Ostřílený štamgast – klobouk dolů!'; }
        else if (procenta >= 0.5) { emoji = '🥃'; titul = 'Slušný výkon, panák byl zasloužený!'; }
        else if (procenta >= 0.3) { emoji = '😅'; titul = 'Ještě jeden fernet a příště to bude lepší!'; }
        else                      { emoji = '🤪'; titul = 'Dneska to byla spíš ta slivovička…'; }
        emojiEl.textContent = emoji;
        titulEl.textContent = titul;
        if (procenta >= 0.7) zvukFanfara();

        ukazZonu('zona-souhrn');
    }

    function hrajZnovu() {
        document.getElementById('skore').textContent = '0';
        ukazZonu('zona-uvod');
    }

    /* ---------------------------------------------------------------------
       ZVUK – generuje se přímo v prohlížeči (Web Audio API),
       žádné soubory nejsou potřeba.
    --------------------------------------------------------------------- */
    var audioCtx = null;
    var ztlumeno = false;

    function zvukInit() {
        if (!audioCtx) {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
            catch (e) { audioCtx = null; }
        }
        zvukResume();
    }
    function zvukResume() {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }
    function toggleMute() {
        ztlumeno = !ztlumeno;
        document.getElementById('mute-btn').textContent = ztlumeno ? '🔇' : '🔊';
    }
    function ton(freq, start, delka, typ, hlasitost) {
        if (!audioCtx || ztlumeno) return;
        var osc = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        osc.type = typ || 'sine';
        osc.frequency.value = freq;
        var t0 = audioCtx.currentTime + start;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(hlasitost || 0.25, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + delka);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(t0); osc.stop(t0 + delka + 0.02);
    }
    function zvukSpravne() {
        // veselé stoupavé „ta-da-dá"
        ton(523.25, 0.00, 0.15, 'triangle', 0.3); // C5
        ton(659.25, 0.12, 0.15, 'triangle', 0.3); // E5
        ton(783.99, 0.24, 0.28, 'triangle', 0.3); // G5
    }
    function zvukSpatne() {
        // krátké klesavé „mm-mm"
        ton(196.00, 0.00, 0.20, 'sawtooth', 0.18); // G3
        ton(155.56, 0.16, 0.28, 'sawtooth', 0.18); // Eb3
    }
    function zvukFanfara() {
        ton(523.25, 0.00, 0.16, 'triangle', 0.3);
        ton(659.25, 0.14, 0.16, 'triangle', 0.3);
        ton(783.99, 0.28, 0.16, 'triangle', 0.3);
        ton(1046.50, 0.42, 0.45, 'triangle', 0.32);
    }
    </script>
